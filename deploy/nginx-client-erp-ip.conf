server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate /etc/ssl/client-erp/ip.crt;
    ssl_certificate_key /etc/ssl/client-erp/ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "Client ERP preview";
    auth_basic_user_file /etc/nginx/client-erp.htpasswd;

    root /opt/client-erp/dist;
    index index.html;
    client_max_body_size 20m;

    location = /jobs/sber {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ^~ /jobs/ { return 404; }

    location ~ ^/(api|public-application|credit-check|health)$ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
