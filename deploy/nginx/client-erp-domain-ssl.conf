server {
    listen 80;
    listen [::]:80;
    server_name mykpk.ru www.mykpk.ru;
    return 301 https://mykpk.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.mykpk.ru;

    ssl_certificate /etc/letsencrypt/live/mykpk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mykpk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mykpk.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mykpk.ru;

    ssl_certificate /etc/letsencrypt/live/mykpk.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mykpk.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/client-erp/dist;
    index index.html;
    client_max_body_size 20m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /jobs/sber {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location ^~ /jobs/ { return 404; }

    location ~ ^/(api|public-application|credit-check|health)$ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
